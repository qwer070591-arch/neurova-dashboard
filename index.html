<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const ui = JSON.parse(localStorage.getItem('neurova-ui-preferences') || '{}')
        const preference = ui.themePreference || ui.theme || 'dark'
        document.documentElement.dataset.theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference === 'light' ? 'light' : 'dark'
        const settings = JSON.parse(localStorage.getItem('neurova:settings:v1') || '{}')
        if (settings.reducedMotion === true) document.documentElement.dataset.reducedMotion = 'true'
      } catch { /* Invalid or unavailable storage falls back to the default dark theme. */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/neurova-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NEUROVA — AI 分析與智慧平台"
    />
    <title>NEUROVA | AI 分析與智慧平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
